version: 2

models:
  - name: stg_statement_files
    description: Cleaned statement-file metadata from raw ingestion.
    columns:
      - name: file_id
        tests:
          - not_null
          - unique
      - name: file_hash
        tests:
          - not_null
          - unique
      - name: parse_status
        tests:
          - not_null
      - name: validation_status
        tests:
          - not_null

  - name: stg_transactions
    description: Typed and lightly standardized transaction rows.
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: file_id
        tests:
          - not_null
      - name: transaction_date
        tests:
          - not_null
      - name: amount
        tests:
          - not_null
      - name: transaction_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["debit", "credit", "zero"]
